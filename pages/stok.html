<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Stok Bibit & Pupuk</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h3 class="fw-bold text-success mb-4"> Manajemen Stok Bibit & Pupuk</h3>

    <!-- Bagian Bibit -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-success text-white fw-bold">
         Data Bibit
      </div>
      <div class="card-body">
        <table class="table table-bordered align-middle text-center">
          <thead class="table-success">
            <tr>
              <th>Nama Bibit</th>
              <th>Jenis</th>
              <th>Masuk</th>
              <th>Keluar</th>
              <th>Sisa Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="bibitTable">
            <!-- Contoh Data -->
            <tr>
              <td>Padi Ciherang</td>
              <td>Padi</td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-masuk" value="120"></td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-keluar" value="40"></td>
              <td class="sisa-stok fw-bold text-success">80</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
            <tr>
              <td>Kedelai Grobogan</td>
              <td>Kacang-kacangan</td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-masuk" value="200"></td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-keluar" value="50"></td>
              <td class="sisa-stok fw-bold text-success">150</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
            <tr>
              <td>Tomat Cherry</td>
              <td>Sayur</td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-masuk" value="90"></td>
              <td><input type="number" class="form-control form-control-sm text-center bibit-keluar" value="10"></td>
              <td class="sisa-stok fw-bold text-success">80</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Bagian Pupuk -->
    <div class="card shadow-sm mb-5">
      <div class="card-header bg-success text-white fw-bold">
         Data Pupuk
      </div>
      <div class="card-body">
        <table class="table table-bordered align-middle text-center">
          <thead class="table-success">
            <tr>
              <th>Nama Pupuk</th>
              <th>Jenis</th>
              <th>Masuk (kg)</th>
              <th>Keluar (kg)</th>
              <th>Sisa Stok (kg)</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="pupukTable">
            <!-- Contoh Data -->
            <tr>
              <td>Urea</td>
              <td>Nitrogen</td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-masuk" value="100"></td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-keluar" value="30"></td>
              <td class="sisa-stok fw-bold text-success">70</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
            <tr>
              <td>ZA</td>
              <td>Amonium Sulfat</td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-masuk" value="80"></td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-keluar" value="20"></td>
              <td class="sisa-stok fw-bold text-success">60</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
            <tr>
              <td>NPK</td>
              <td>Campuran</td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-masuk" value="120"></td>
              <td><input type="number" class="form-control form-control-sm text-center pupuk-keluar" value="50"></td>
              <td class="sisa-stok fw-bold text-success">70</td>
              <td><button class="btn btn-sm btn-outline-primary update-btn">Update</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</body>
</html>
