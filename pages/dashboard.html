<h3 class="mb-4"> Dashboard Monitoring Tanaman</h3>

<div class="row">
  <!-- Kolom kiri: Monitoring -->
  <div class="col-md-12 col-lg-6 mb-4">
    <div class="card p-3 mb-4">
      <h5 class="mb-3"> Kondisi Tanaman Saat Ini</h5>
      <div class="row text-center">
        <div class="col">
          <div class="card bg-light p-3 shadow-sm">
            <h6>pH Tanah</h6>
            <h3 id="phValue">6.8</h3>
            <p>Kondisi Optimal</p>
          </div>
        </div>
        <div class="col">
          <div class="card bg-light p-3 shadow-sm">
            <h6>Kelembapan (%)</h6>
            <h3 id="humidityValue">72</h3>
            <p>Ideal</p>
          </div>
        </div>
        <div class="col">
          <div class="card bg-light p-3 shadow-sm">
            <h6>Suhu (°C)</h6>
            <h3 id="temperatureValue">27</h3>
            <p>Normal</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Grafik Data Sensor -->
    <div class="container px-0">
      <div class="card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="fw-bold text-success mb-0">Grafik Perubahan Data Sensor</h5>
        </div>
        <canvas id="sensorChart" height="250"></canvas>
      </div>
    </div>
  </div>

  <!-- Device Penyiraman Otomatis -->
<div class="col-md-12 col-lg-6">
  <div class="card p-4 shadow-sm">
    <h5 class="mb-3"> Kontrol Penyiraman Otomatis</h5>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <p class="mb-1 text-muted">Status Pompa:</p>
        <h5 id="pumpStatus" class="text-danger fw-bold">OFF</h5>
      </div>
      <button id="togglePumpBtn" class="btn btn-lg btn-outline-success"> Nyalakan</button>
    </div>

    <hr>

    <div class="mb-3">
      <p class="mb-1 text-muted">Mode Otomatis:</p>
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="autoModeSwitch" checked>
        <label class="form-check-label" for="autoModeSwitch">Aktif</label>
      </div>
    </div>

    <div id="logContainer" class="mt-4">
      <h6> Riwayat Penyiraman</h6>
      <ul id="wateringLog" class="list-group small"></ul>
    </div>
  </div>
</div>
